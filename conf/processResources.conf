// Process CPU/memory requirements, expressed in portable Nextflow syntax (no bsub
// strings here) so this file works unchanged under any executor (LSF, Slurm, ...).
// Executor-specific submission flags belong in conf/lsf.config (or its future
// Slurm equivalent) instead. Values mirror the per-entry-point defaults
// ApiCommonWorkflow's Make*NextflowConfig.pm steps already pass in production
// (core, peripheralEntry, incremental all define a subset of these process names;
// unused withName blocks are simply ignored by whichever entry point is running).
process {
    withName: 'diamond' {
        errorStrategy = { task.exitStatus in 130..140 ? 'retry' : 'finish' }
        memory = { task.attempt > 1 ? '20 GB' : '25 GB' }
    }
    withName: 'computeGroups' {
        errorStrategy = { task.exitStatus in 130..140 ? 'retry' : 'finish' }
        memory = { task.attempt > 1 ? '45 GB' : '40 GB' }
    }
    withName: 'peripheralDiamond' {
        errorStrategy = { task.exitStatus in 130..140 ? 'retry' : 'finish' }
        memory = { task.attempt > 1 ? '20 GB' : '25 GB' }
    }
    withName: 'incrementalDiamond' {
        errorStrategy = { task.exitStatus in 130..140 ? 'retry' : 'finish' }
        memory = { task.attempt > 1 ? '20 GB' : '25 GB' }
    }
    withName: 'selfDiamondGroup' {
        // Matches the --threads 1 pinned in selfDiamondGroup.bash: without an
        // explicit cpus request here, diamond's own auto-detected thread count
        // (every core on the node) had nothing to line up against.
        cpus = 1
        errorStrategy = { task.exitStatus in 130..140 ? 'retry' : 'finish' }
        memory = { task.attempt > 1 ? '30 GB' : '35 GB' }
    }
}
